name: Deploy Worker

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install wrangler
        run: npm install -g wrangler
      
      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure repository Actions secrets CLOUDFLARE_API_TOKEN and CF_ACCOUNT_ID before deployment."
            exit 1
          fi

      - name: Resolve existing SUBLINK_KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Reuse the production KV. Never auto-create a new empty namespace.
          LIST_OUTPUT=$(wrangler kv namespace list)
          KV_ID=$(printf '%s' "$LIST_OUTPUT" | jq -er '.[] | select(.title == "SUBLINK_KV") | .id')
          if ! [[ "$KV_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Existing SUBLINK_KV namespace was not found or has an invalid ID."
            exit 1
          fi
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Bind only the existing SUBLINK_KV namespace
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const content = fs.readFileSync('wrangler.toml', 'utf8');
          const pattern = /(\{\s*binding\s*=\s*"SUBLINK_KV"\s*,\s*id\s*=\s*")[^"]+("\s*\})/g;
          if ([...content.matchAll(pattern)].length !== 1) {
            throw new Error('Expected exactly one SUBLINK_KV binding in wrangler.toml');
          }
          fs.writeFileSync('wrangler.toml', content.replace(pattern, (_, first, last) => first + process.env.KV_ID + last));
          NODE

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
