services:
  worker:
    # Build from source so the image always matches this repo; set
    # SUBLINK_WORKER_IMAGE if you publish your own prebuilt image.
    build: .
    image: ${SUBLINK_WORKER_IMAGE:-sublink-worker-plus:latest}
    ports:
      - "8787:8787"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: sublink
      # Set to 0 to keep stored configs without automatic expiration.
      CONFIG_TTL_SECONDS: 2592000
      # Uncomment to enable the /admin panel.
      # ADMIN_PASSWORD: changeme
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
volumes:
  redis-data:
